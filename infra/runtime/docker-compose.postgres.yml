services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${DB_CONTAINER_NAME:-agent-team_db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-deep_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kevindz}
      POSTGRES_DB: ${DB_DATABASE:-agent}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-deep_agent} -d ${DB_DATABASE:-agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME:-agent-team_adminer}
    command: php -S 0.0.0.0:8080 -t /var/www/html
    environment:
      ADMINER_PLUGINS: tables-filter json-column table-indexes-structure
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  am_pgdata:
    driver: local

networks:
  default:
    name: agent-team-db
